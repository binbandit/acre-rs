[package]
name = "acre"
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
description = "Warm, reusable Git workspaces. Every branch, already ready."
license = "MIT OR Apache-2.0"
authors = ["Brayden Moon"]
repository = "https://github.com/binbandit/acre-rs"
readme = "README.md"
keywords = ["git", "worktree", "workspace", "cache", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "acre"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1.29", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7.0"
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
wait-timeout = "0.2"
tempfile = "3.27"
fs4 = "1.1"
# Held at 8.x: from 9.0 the native Child that wait-timeout needs is reachable only through an
# unsafe accessor, and this crate denies unsafe code.
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object", "tracing"] }
unicode-width = "0.2.3"
unicode-segmentation = "1.13.3"

# clonefile(2) clones a whole directory tree in one call; `cp -cR` clones file by file.
[target.'cfg(target_os = "macos")'.dependencies]
reflink-copy = "0.1.32"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
vt100 = "0.18"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
