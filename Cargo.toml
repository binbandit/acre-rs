[package]
name = "acre"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Warm, reusable Git workspaces. Every branch, already ready."
license = "MIT OR Apache-2.0"
authors = ["Brayden Moon"]
repository = "https://github.com/binbandit/acre"
readme = "README.md"
keywords = ["git", "worktree", "workspace", "cache", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "acre"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1.26", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6.0"
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
wait-timeout = "0.2"
tempfile = "3.27"
fs4 = "1.1"
process-wrap = { version = "8.2.1", default-features = false, features = ["std", "process-group", "job-object", "tracing"] }
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
vt100 = "0.15"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
